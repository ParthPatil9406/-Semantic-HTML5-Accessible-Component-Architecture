<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Support contact form"><title>Support | Enterprise Dashboard</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><a class="brand" href="index.html">Enterprise Dashboard</a><nav aria-label="Primary navigation"><ul><li><a href="index.html">Overview</a></li><li><a href="users.html">Users</a></li><li><a href="reports.html">Reports</a></li></ul></nav></header>
<main id="main-content" class="standalone" tabindex="-1">
<section aria-labelledby="support-heading"><p class="eyebrow">Support</p><h1 id="support-heading">Contact support</h1>
<form class="form-card">
<fieldset><legend>Support request</legend>
<div><label for="support-name">Name</label><input id="support-name" name="support-name" type="text" autocomplete="name" required></div>
<div><label for="support-email">Email</label><input id="support-email" name="support-email" type="email" autocomplete="email" required></div>
<div><label for="support-message">Message</label><textarea id="support-message" name="support-message" rows="6" minlength="10" required aria-describedby="message-help"></textarea><p id="message-help" class="help">Please provide at least 10 characters.</p></div>
</fieldset>
<button class="button" type="submit">Send request</button>
</form></section>
</main>
<footer class="site-footer"><p>&copy; 2026 Enterprise Dashboard</p></footer>
</body></html>
